# dsh-asr-voice — 语音输入 + 提示词优化 bundle patch
#
# 功能：
# - 语音输入：输入框工具行麦克风按钮，浏览器 Web Speech API（默认，免费免 key，
#   Chrome/Edge 双平台）或云端 OpenAI-compatible ASR（OpenAI / Groq /
#   硅基流动 / 通义 Qwen-ASR，可自定义 baseUrl + model）。
# - 提示词优化：本地启发式（默认，zh/en 清洗）或可选 LLM 重写（走 host 代理）。
# - 设置页卡片：「设置 → 插件 → 配置」→「语音输入」（settings.plugin.item,
#   key: asr-voice；host 注册同名 settings namespace 让配置 tab 枚举到卡片）。
# - 所有 API key 只存 host settings（服务端），浏览器经 /api/asr-voice/* 代理，
#   key 不进前端。纯 Node HTTP 实现，macOS / Windows 双平台。
#
# host inject 为各子模块并集（webServer/settings）。注意：inject 项是
# Cordis 服务名（非 entry id）。
#
# Install:   dsh plugin --profile <profile> add <path-or-github>

- insert:
    - id: dsh-asr-voice
      name: dsh-asr-voice
      inject:
        - webServer
        - settings
